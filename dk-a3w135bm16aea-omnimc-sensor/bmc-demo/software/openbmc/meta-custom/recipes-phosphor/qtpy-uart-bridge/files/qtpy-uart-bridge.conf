# qtpy-uart-bridge token -> ExternalSensor mapping.
#
# One mapping per line. Fields are whitespace-separated:
#
#   TOKEN   sensor_object_path   [scale]   [offset]   [min]   [max]
#
#   TOKEN               UART key from the QT Py (matched case-insensitively).
#   sensor_object_path  dbus-sensors ExternalSensor object path. It MUST match an
#                       ExternalSensor declared in entity-manager (entity-config.json);
#                       the bridge only sets its Value, it does not create it.
#   scale/offset        published = clamp(num*scale + offset, min, max).
#                       scale defaults to 1, offset to 0 when omitted.
#   min/max             optional clamp bounds (omit for unbounded).
#
# Lines starting with '#' and blank lines are ignored. Unknown UART tokens are
# ignored. To surface a NEW QT Py value: add a line here AND add a matching
# ExternalSensor to entity-config.json. No recompile needed; the dashboard
# auto-discovers the sensor.
#
# The knob/potentiometer is published as "Heater_PWM" in the humidity namespace
# (bmcweb surfaces PercentRH as a "%" reading; the dashboard labels it "Heater").
# 0.00152590 = 100/65535 converts the QT Py's raw 16-bit ADC count to percent.
# SLIDERS is the current firmware token; HEATER is the post-rename token. Both
# carry the same raw 16-bit knob value, so the firmware rename needs no BMC change.

# TOKEN    sensor_object_path                                scale        offset  min  max
SLIDERS    /xyz/openbmc_project/sensors/humidity/Heater_PWM  0.00152590   0       0    100
HEATER     /xyz/openbmc_project/sensors/humidity/Heater_PWM  0.00152590   0       0    100
