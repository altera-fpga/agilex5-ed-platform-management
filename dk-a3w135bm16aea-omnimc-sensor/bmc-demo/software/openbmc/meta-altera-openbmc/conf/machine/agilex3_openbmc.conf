#@TYPE: Machine
#@NAME: Altera SoCFPGA Agilex3E 135B OpenBMC
#@DESCRIPTION: Machine configuration for Agilex 3E 135B SoCFPGA running OpenBMC
#
# Derived from agilex5e_013b.conf (GSRD) — removes GSRD-only items
# (multilib, ubifs/jffs2, XEN, extlinux, sysvinit conditionals) and adds
# OpenBMC-specific settings (phosphor distro features, wic+tar.xz image types).
# All common hardware settings are kept unchanged to ease diffing.
#
#   socfpga_armv8-2a.inc  (CPU/SoC arch)
#       ├── agilex5e_013b.conf        (GSRD)
#       └── agilex3_openbmc.conf (OpenBMC — this file)

require conf/machine/include/socfpga_armv8-2a.inc

# default root home directory
ROOT_HOME = "/home/root"

# Machine name strip — must match the baseline agilex5e_013b.conf value
# so that meta-altera-bsp finds fit_agilex5_kernel.its (not fit_agilex5e_013b_kernel.its)
MACHINE_STRIP = "agilex3"

# Boot source — SD only for Phase 0
SSBL_BOOT_SOURCE ??= "mmc0"

# U-Boot configuration - use defconfig from kas.yml
UBOOT_CONFIG = "agilex3e-135b-socdk-atf"
UBOOT_CONFIG[agilex3e-135b-socdk-atf] = "${UBOOT_DEFCONFIG}"

KBUILD_DEFCONFIG ?= "defconfig"

UBOOT_BINARY = "u-boot.itb"
UBOOT_SUFFIX = "itb"

KERNEL_IMAGETYPE = "Image"

# LINUX_DTB_FILE and FPGA_LINUX_DTB_FILE are derived at parse time by
# meta-custom/recipes-kernel/linux/linux-socfpga-lts_%.bbappend from
# LINUX_DTS_FILE and CUSTOM_LINUX_DTS_FILE (mirrors baseline pattern).
LINUX_DTB_FILE ?= "socfpga_agilex3_socdk.dtb"

KERNEL_DEVICETREE ?= "\
			intel/${LINUX_DTB_FILE} \
			"
UBOOT_ENTRYPOINT = "0x4000000"
UBOOT_LOADADDRESS = "0x4000000"
FIT_KERNEL_COMP_ALG = "none"

SERIAL_CONSOLES ?= "115200;ttyS0"

UBOOT_DEVICE_TREE ?= "socfpga_agilex3_socdk.dtb"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append = " device-tree fpga-bitstream"

# Auto-load the ADI AXI fan control hwmon driver on boot so fansensor can
# discover /sys/class/hwmon/hwmonN/fan1_input and pwm1 from the FPGA AXI fan IP.
KERNEL_MODULE_AUTOLOAD:append = " axi-fan-control"

EXTRA_IMAGEDEPENDS:append = " \
		u-boot-socfpga-scr \
		u-boot-socfpga-env-var \
		"

# ---------------------------------------------------------------------------
# OpenBMC / phosphor distro requirements
# ---------------------------------------------------------------------------
# Use dbus-sensors as the hwmon sensor daemon (discovers soc64-hwmon via
# entity-manager; creates D-Bus sensor objects with chassis associations so
# Redfish /Chassis/{id}/Sensors is populated). Prevents phosphor-hwmon from
# being pulled in via virtual runtime dependencies.
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "dbus-sensors"

DISTRO_FEATURES:append = " systemd usrmerge"
# Hostless BMC: the HPS is the BMC itself — no host CPU to control.
# Remove host-IPMI and host-control features so their FEATURE_PACKAGES
# are not pulled into the image even if meta-altera-fpga adds them via
# COMBINED_FEATURES. Mirrors the 9elements approach.
DISTRO_FEATURES:remove = "obmc-host-ipmi obmc-host-ctl"
# Prevent phosphor-ipmi-host's RRECOMMENDS chain from pulling in
# phosphor-ipmi-fru via packagegroup-obmc-ipmid-providers-libs.
VIRTUAL-RUNTIME_phosphor-ipmi-providers = ""
# Suppress net-IPMI (RMCP) feature packages — hostless platforms cannot run RMCP.
FEATURE_PACKAGES_obmc-net-ipmi:agilex3_openbmc = ""

# Explicit virtual provider declarations — prevents ambiguity if meta-altera-fpga
# or other layers also claim these virtuals.
PREFERRED_PROVIDER_virtual/obmc-chassis-mgmt = "packagegroup-apps"
PREFERRED_PROVIDER_virtual/obmc-fan-mgmt     = "packagegroup-apps"
PREFERRED_PROVIDER_virtual/obmc-flash-mgmt   = "packagegroup-apps"
PREFERRED_PROVIDER_virtual/obmc-system-mgmt  = "packagegroup-apps"

INIT_MANAGER         = "systemd"
# obmc-bmc-state-mgmt:      BMC state management (bmcweb /Managers/bmc)
# obmc-phosphor-flash-mgmt: firmware update via Redfish UpdateService
# obmc-phosphor-fan-mgmt:   fan management — entity-manager + fansensor + axi-fan-control
MACHINE_FEATURES    += " \
    obmc-bmc-state-mgmt \
    obmc-phosphor-flash-mgmt \
    obmc-phosphor-fan-mgmt \
    "

# ---------------------------------------------------------------------------
# Image output: SD card image (.wic) and rootfs tarball (.tar.xz)
# Phase 0 testing: flash .wic to SD card, same boot flow as GSRD baseline
# ---------------------------------------------------------------------------
WKS_FILE ?= "sdimage.wks"
IMAGE_FSTYPES = "wic tar.xz"
IMAGE_FEATURES:append = " allow-empty-password empty-root-password"
