#@TYPE: Machine
#@NAME: Altera Agilex5E MitySOM-A5E Mini on Antmicro DC-SCM carrier (OpenBMC)
#@DESCRIPTION: OpenBMC machine for the Critical Link MitySOM-A5E Mini SoM on the
#              Antmicro DC-SCM carrier board (dc-scm-devkit-a5edb161x4mrics). Same Agilex5E 013B
#              silicon as the SM43 devkit, so it inherits agilex5e_013b_openbmc
#              and overrides only the carrier-specific hardware deltas.
#
#   socfpga_armv8-2a.inc
#       └── agilex5e_013b_openbmc.conf   (common OpenBMC 013B machine)
#             └── agilex5e_dcscm_openbmc.conf  (DC-SCM carrier — this file)

require conf/machine/agilex5e_013b_openbmc.conf

# ---------------------------------------------------------------------------
# Carrier-specific hardware deltas vs the SM43 devkit (agilex5e_013b_openbmc)
# ---------------------------------------------------------------------------

# Console — the MitySOM-A5E Mini / DC-SCM carrier wires the HPS console to
# UART1 (the SoCDK 013B devkit uses UART0). This selects ATF's console
# (SOCFPGA_UART_CONFIG=1 -> PLAT_UART1_BASE, consumed by the shared
# arm-trusted-firmware bbappend). U-Boot and Linux match via serial0=&uart1 in
# their device trees; SERIAL_CONSOLES=ttyS0 then maps to UART1.
SOCFPGA_UART_CONFIG = "1"

# Re-scope the base file's machine-name-specific overrides for this MACHINE
# (the base scopes them to :agilex5e_013b_openbmc, which does not fire here).
FEATURE_PACKAGES_obmc-net-ipmi:agilex5e_dcscm_openbmc = ""

# ---------------------------------------------------------------------------
# Sensors — DC-SCM carrier exposes ONLY the on-carrier temperature sensor
# ---------------------------------------------------------------------------
# The Antmicro DC-SCM reference shows a single "DC SCM Breakout Board" entry on
# the webui/Redfish Sensors page: the TI TMP75 @0x48 on HPS I3C1, read by stock
# phosphor-hwmon. This board does NOT carry the SM43 sensor-board demo
# peripherals (AXI fan, accel, QT Py heater, P3T1755, TSC1641), so:
#   - use phosphor-hwmon (not the base 013B machine's dbus-sensors choice), and
#   - drop the SM43 AXI-fan-control kernel autoload.
# The one sensor + its chassis association are wired in packagegroup-apps
# (${PN}-fans -> phosphor-hwmon + phosphor-inventory-manager-chassis) and the
# meta-altera-openbmc phosphor-hwmon / phosphor-inventory-manager bbappends.
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "phosphor-hwmon"
KERNEL_MODULE_AUTOLOAD:remove = "axi-fan-control"
